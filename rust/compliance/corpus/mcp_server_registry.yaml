# MCP server registry: server/version/endpoint CRUD, tags, aliases, dual route
# prefixes, pagination, and representative validation/not-found errors.
cases:
  - name: mcp_create_server
    method: POST
    path: /api/3.0/mlflow/mcp-servers
    body:
      name: com.example/compliance
      description: compliance server
      icons: [{src: "https://example.com/icon.svg", mimeType: "image/svg+xml", future: null}]

  - name: mcp_get_server_ajax
    method: GET
    path: /ajax-api/3.0/mlflow/mcp-servers/com.example/compliance

  - name: mcp_update_server
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance
    body: {display_name: Compliance, description: updated}

  - name: mcp_set_server_tag
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/tags
    body: {key: owner, value: rust}

  - name: mcp_create_version
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions
    body:
      server_json:
        name: com.example/compliance
        version: 1.0.0
        description: first version
        future_object: {kept: true, explicit_null: null}
      display_name: First
      status: active
      source: compliance
      tools:
        - name: echo
          description: Echo input
          inputSchema: {type: object}

  - name: mcp_create_version_ajax
    method: POST
    path: /ajax-api/3.0/mlflow/mcp-servers/com.example/compliance/versions
    body:
      server_json: {name: com.example/compliance, version: 1.1.0, explicit_null: null}
      status: draft

  - name: mcp_get_version
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions/1.0.0

  - name: mcp_update_version
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions/1.1.0
    body: {display_name: Candidate, status: active, tools: []}

  - name: mcp_set_version_tag
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions/1.1.0/tags
    body: {key: channel, value: stable}

  - name: mcp_set_alias
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/aliases
    body: {alias: production, version: 1.1.0}

  - name: mcp_get_alias_ajax
    method: GET
    path: /ajax-api/3.0/mlflow/mcp-servers/com.example/compliance/aliases/production

  - name: mcp_get_latest_alias
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/aliases/latest

  - name: mcp_create_endpoint_version
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/endpoints
    body:
      url: "https://mcp.example.com/v1"
      transport_type: streamable-http
      server_version: 1.0.0
    bind:
      - {bind: mcp_endpoint_version, from: "$.id"}

  - name: mcp_create_endpoint_alias_ajax
    method: POST
    path: /ajax-api/3.0/mlflow/mcp-servers/com.example/compliance/endpoints
    body:
      url: "https://mcp.example.com/prod"
      transport_type: sse
      server_alias: production
    bind:
      - {bind: mcp_endpoint_alias, from: "$.id"}

  - name: mcp_get_endpoint
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/endpoints/${mcp_endpoint_version}

  - name: mcp_update_endpoint
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/endpoints/${mcp_endpoint_version}
    body: {url: "https://mcp.example.com/updated", server_version: 1.1.0}

  - name: mcp_search_servers
    method: GET
    path: /api/3.0/mlflow/mcp-servers
    query: {filter_string: "tags.owner = 'rust'", order_by: name ASC}
    normalize:
      drop_paths: ["$.mcp_servers[0].access_endpoints"]

  - name: mcp_search_versions
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions
    query: {filter_string: "status IN ('active')", order_by: "`version` DESC"}

  - name: mcp_search_server_endpoints
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/endpoints
    query: {server_version: 1.1.0}

  - name: mcp_search_all_endpoints_ajax
    method: GET
    path: /ajax-api/3.0/mlflow/mcp-servers/endpoints
    query: {server_alias: production}

  - name: mcp_create_page_server_1
    method: POST
    path: /api/3.0/mlflow/mcp-servers
    body: {name: com.example/page-one}

  - name: mcp_create_page_server_2
    method: POST
    path: /api/3.0/mlflow/mcp-servers
    body: {name: com.example/page-two}

  - name: mcp_search_pagination
    method: GET
    path: /api/3.0/mlflow/mcp-servers
    query: {max_results: 1, order_by: name ASC}
    walk: {token_field: next_page_token, token_param: page_token, max_pages: 10}
    normalize:
      drop_paths: ["$.mcp_servers[0].access_endpoints"]

  # ---- 2026-08-02 net-state parity ----
  - name: mcp_create_version_enveloped
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/enveloped/versions
    body:
      server_json:
        server:
          name: com.example/enveloped
          version: 1.0.0
          description: copied registry envelope
        _meta: {registry: ignored}
      status: active

  - name: mcp_create_version_raw_precedence
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/raw-wins/versions
    body:
      server_json:
        name: com.example/raw-wins
        version: 1.0.0
        server: {name: com.example/nested-loses, version: 9.9.9}
      status: active

  - name: mcp_create_tools_omitted
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/tools-omitted/versions
    body:
      server_json: {name: com.example/tools-omitted, version: 1.0.0}
      status: active

  - name: mcp_endpoint_tools_omitted_is_null
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/tools-omitted/endpoints
    body:
      url: https://mcp.example.com/tools-omitted
      server_version: 1.0.0

  - name: mcp_create_tools_null
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/tools-null/versions
    body:
      server_json: {name: com.example/tools-null, version: 1.0.0}
      status: active
      tools: null

  - name: mcp_endpoint_tools_null_is_null
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/tools-null/endpoints
    body:
      url: https://mcp.example.com/tools-null
      server_version: 1.0.0

  - name: mcp_create_tools_empty
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/tools-empty/versions
    body:
      server_json: {name: com.example/tools-empty, version: 1.0.0}
      status: active
      tools: []

  - name: mcp_endpoint_tools_empty_is_empty
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/tools-empty/endpoints
    body:
      url: https://mcp.example.com/tools-empty
      server_version: 1.0.0

  - name: mcp_create_server_icons_server_only
    method: POST
    path: /api/3.0/mlflow/mcp-servers
    body:
      name: com.example/icons-server-only
      icons: [{src: https://example.com/server-only.svg, theme: dark}]

  - name: mcp_create_version_icons_version_only
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/icons-version-only/versions
    body:
      server_json:
        name: com.example/icons-version-only
        version: 1.0.0
        icons: [{src: https://example.com/version-only.svg}]
      status: active

  - name: mcp_get_server_icons_version_only
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/icons-version-only

  - name: mcp_create_server_icons_backfill
    method: POST
    path: /api/3.0/mlflow/mcp-servers
    body:
      name: com.example/icons-backfill
      icons:
        - {src: https://example.com/server-dark.svg, theme: dark}
        - {src: https://example.com/server-default.svg}

  - name: mcp_create_version_icons_backfill
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/icons-backfill/versions
    body:
      server_json:
        name: com.example/icons-backfill
        version: 1.0.0
        icons:
          - {src: https://example.com/version-dark.svg, theme: dark}
          - {src: https://example.com/version-light.svg, theme: light}
          - {src: https://example.com/version-default.svg}
      status: active

  - name: mcp_get_server_icons_backfill_theme_dedupe
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/icons-backfill

  - name: mcp_update_server_icons_preserves_resolution
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/icons-backfill
    body: {description: updated without changing icons}

  - name: mcp_search_server_icons_preserves_resolution
    method: GET
    path: /api/3.0/mlflow/mcp-servers
    query: {filter_string: "name = 'com.example/icons-backfill'"}

  - name: mcp_create_server_icons_empty_override
    method: POST
    path: /api/3.0/mlflow/mcp-servers
    body: {name: com.example/icons-empty, icons: []}

  - name: mcp_create_version_icons_empty_override
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/icons-empty/versions
    body:
      server_json:
        name: com.example/icons-empty
        version: 1.0.0
        icons: [{src: https://example.com/version-fallback.svg}]
      status: active

  - name: mcp_get_server_icons_empty_override
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/icons-empty

  - name: mcp_create_version_connect_options_and_ignore_display_name
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/connect-options/versions
    body:
      server_json: {name: com.example/connect-options, version: 1.0.0}
      display_name: ignored version display name
      status: active
      connect_options:
        packages: {hidden: true}

  - name: mcp_update_version_connect_options_omitted
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/connect-options/versions/1.0.0
    body: {display_name: still ignored}

  - name: mcp_update_version_connect_options_null
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/connect-options/versions/1.0.0
    body: {connect_options: null}

  - name: mcp_update_version_connect_options_replace
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/connect-options/versions/1.0.0
    body:
      connect_options:
        remotes: {hidden: false}

  - name: mcp_create_endpoint_resolved_version_has_no_display_name
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/connect-options/endpoints
    body:
      url: https://mcp.example.com/connect-options
      server_version: 1.0.0

  - name: mcp_delete_endpoint
    method: DELETE
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/endpoints/${mcp_endpoint_alias}

  - name: mcp_delete_alias
    method: DELETE
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/aliases/production

  - name: mcp_delete_version_tag
    method: DELETE
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions/1.1.0/tags/channel

  - name: mcp_delete_server_tag
    method: DELETE
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/tags/owner

  - name: mcp_deprecate_version_1
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions/1.0.0
    body: {status: deprecated}

  - name: mcp_delete_version_1
    method: DELETE
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions/1.0.0

  - name: mcp_deprecate_version_2
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions/1.1.0
    body: {status: deprecated}

  - name: mcp_delete_version_2
    method: DELETE
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance/versions/1.1.0

  - name: mcp_delete_server
    method: DELETE
    path: /api/3.0/mlflow/mcp-servers/com.example/compliance

  # ---- Errors ----
  - name: mcp_bad_name
    method: POST
    path: /api/3.0/mlflow/mcp-servers
    body: {name: bad}
    expect_status: 400

  - name: mcp_bad_semver
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/invalid/versions
    body:
      server_json: {name: com.example/invalid, version: 01.0.0}
    expect_status: 400

  - name: mcp_missing_server
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/missing
    expect_status: 404

  - name: mcp_envelope_non_dict_server
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/bad-envelope/versions
    body:
      server_json: {server: not-an-object}
    expect_status: 400

  - name: mcp_envelope_missing_inner_name_passthrough
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/missing-envelope-name/versions
    body:
      server_json:
        server: {version: 1.0.0}
    expect_status: 400

  - name: mcp_server_json_non_dict
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/non-dict/versions
    body: {server_json: not-an-object}
    expect_status: 400

  - name: mcp_reject_version_source_server_icon
    method: POST
    path: /api/3.0/mlflow/mcp-servers
    body:
      name: com.example/reject-server-icon
      icons: [{src: https://example.com/rejected.svg, source: version}]
    expect_status: 400

  - name: mcp_reject_version_source_server_json_icon
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/reject-version-icon/versions
    body:
      server_json:
        name: com.example/reject-version-icon
        version: 1.0.0
        icons: [{src: https://example.com/rejected.svg, source: version}]
    expect_status: 400

  - name: mcp_reject_version_source_tool_icon
    method: POST
    path: /api/3.0/mlflow/mcp-servers/com.example/reject-tool-icon/versions
    body:
      server_json: {name: com.example/reject-tool-icon, version: 1.0.0}
      tools:
        - name: rejected
          icons: [{src: https://example.com/rejected.svg, source: version}]
    expect_status: 400

  - name: mcp_update_reject_version_source_server_icon
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/icons-backfill
    body:
      icons: [{src: https://example.com/rejected-update.svg, source: version}]
    expect_status: 400

  - name: mcp_update_reject_version_source_tool_icon
    method: PATCH
    path: /api/3.0/mlflow/mcp-servers/com.example/connect-options/versions/1.0.0
    body:
      tools:
        - name: rejected-update
          icons: [{src: https://example.com/rejected-update.svg, source: version}]
    expect_status: 400
