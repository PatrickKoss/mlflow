# Native ASGI artifact routes with serving enabled but no destination configured.
cases:
  - name: artifact_get_destination_unconfigured
    method: GET
    path: /api/2.0/mlflow-artifacts/artifacts/file.txt
    expect_status: 503

  - name: artifact_put_destination_unconfigured
    method: PUT
    path: /ajax-api/2.0/mlflow-artifacts/artifacts/file.txt
    raw_body: "not written"
    expect_status: 503
