# Section 3.3 - Metrics history endpoints (proto get-history +
# get-history-bulk-interval, ajax get-history-bulk). Builds its own run so the
# section is self-contained regardless of order relative to runs.yaml.
cases:
  - name: metrics_setup_experiment
    method: POST
    path: /api/2.0/mlflow/experiments/create
    body: {name: metrics_exp}
    bind:
      - {bind: metrics_exp, from: "$.experiment_id"}

  - name: metrics_setup_run
    method: POST
    path: /api/2.0/mlflow/runs/create
    body: {experiment_id: "${metrics_exp}", start_time: 1000, tags: [{key: mlflow.runName, value: mrun}]}
    bind:
      - {bind: metrics_run, from: "$.run.info.run_id"}

  - name: metrics_log_batch_series
    method: POST
    path: /api/2.0/mlflow/runs/log-batch
    body:
      run_id: "${metrics_run}"
      metrics:
        - {key: loss, value: 1.0, timestamp: 100, step: 0}
        - {key: loss, value: 0.8, timestamp: 200, step: 1}
        - {key: loss, value: 0.6, timestamp: 300, step: 2}
        - {key: loss, value: 0.5, timestamp: 400, step: 3}

  - name: metrics_setup_sparse_run
    method: POST
    path: /api/2.0/mlflow/runs/create
    body: {experiment_id: "${metrics_exp}", start_time: 1000, tags: [{key: mlflow.runName, value: sparse}]}
    bind:
      - {bind: metrics_sparse_run, from: "$.run.info.run_id"}

  - name: metrics_log_dense_duplicate_step_zero
    method: POST
    path: /api/2.0/mlflow/runs/log-batch
    body:
      run_id: "${metrics_run}"
      metrics:
        - {key: dense_zero, value: 0.0, timestamp: 1000, step: 0}
        - {key: dense_zero, value: 1.0, timestamp: 1001, step: 0}
        - {key: dense_zero, value: 2.0, timestamp: 1002, step: 0}
        - {key: dense_zero, value: 3.0, timestamp: 1003, step: 0}
        - {key: dense_zero, value: 4.0, timestamp: 1004, step: 0}
        - {key: dense_zero, value: 5.0, timestamp: 1005, step: 0}
        - {key: dense_zero, value: 6.0, timestamp: 1006, step: 0}
        - {key: dense_zero, value: 7.0, timestamp: 1007, step: 0}
        - {key: dense_zero, value: 8.0, timestamp: 1008, step: 0}
        - {key: dense_zero, value: 9.0, timestamp: 1009, step: 0}
        - {key: dense_zero, value: 10.0, timestamp: 1010, step: 0}
        - {key: dense_zero, value: "NaN", timestamp: 1011, step: 0}

  - name: metrics_log_sparse_series
    method: POST
    path: /api/2.0/mlflow/runs/log-batch
    body:
      run_id: "${metrics_sparse_run}"
      metrics:
        - {key: dense_zero, value: 20.0, timestamp: 2000, step: 0}
        - {key: dense_zero, value: 21.0, timestamp: 2001, step: 7}
        - {key: dense_zero, value: 22.0, timestamp: 2002, step: 99}

  - name: metric_get_history
    method: GET
    path: /api/2.0/mlflow/metrics/get-history
    query: {run_id: "${metrics_run}", metric_key: loss}

  - name: metric_get_history_paginated
    method: GET
    path: /api/2.0/mlflow/metrics/get-history
    query: {run_id: "${metrics_run}", metric_key: loss, max_results: 2}
    walk:
      token_field: next_page_token
      token_param: page_token
      max_pages: 10

  - name: metric_get_history_bulk_interval
    method: GET
    path: /ajax-api/2.0/mlflow/metrics/get-history-bulk-interval
    query: {run_ids: "${metrics_run}", metric_key: loss, max_results: 100}

  - name: metric_get_history_bulk_interval_dense_duplicate_steps
    method: GET
    path: /ajax-api/2.0/mlflow/metrics/get-history-bulk-interval
    query: {run_ids: "${metrics_run}", metric_key: dense_zero, max_results: 5}

  - name: metric_get_history_bulk_interval_independent_runs
    method: GET
    path: /ajax-api/2.0/mlflow/metrics/get-history-bulk-interval
    query:
      run_ids: ["${metrics_run}", "${metrics_sparse_run}"]
      metric_key: dense_zero
      max_results: 5

  - name: metric_get_history_bulk_ajax
    method: GET
    path: /ajax-api/2.0/mlflow/metrics/get-history-bulk
    query: {run_id: "${metrics_run}", metric_key: loss}

  # ---- Errors ----
  - name: metric_get_history_missing_run
    method: GET
    path: /api/2.0/mlflow/metrics/get-history
    query: {run_id: "nonexistent", metric_key: loss}
    expect_status: 404

  - name: metric_get_history_bulk_interval_lone_start_step
    method: GET
    path: /ajax-api/2.0/mlflow/metrics/get-history-bulk-interval
    query: {run_ids: "${metrics_run}", metric_key: loss, start_step: 1}
    expect_status: 400
