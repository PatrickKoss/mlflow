# Plan §12.3 - scorer CRUD/versioning and online-scoring configuration.
cases:
  - name: scorer_register_v1
    method: POST
    path: /api/3.0/mlflow/scorers/register
    body:
      experiment_id: "0"
      name: corpus-length
      serialized_scorer: '{"name":"corpus-length","builtin_scorer_class":"ResponseLength","builtin_scorer_pydantic_data":{"max_length":100}}'
    bind:
      - {bind: scorer_id_v1, from: "$.scorer_id"}
    expect_status: 200

  - name: scorer_register_v2
    method: POST
    path: /ajax-api/3.0/mlflow/scorers/register
    body:
      experiment_id: "0"
      name: corpus-length
      serialized_scorer: '{"name":"corpus-length","builtin_scorer_class":"ResponseLength","builtin_scorer_pydantic_data":{"max_length":50}}'
    bind:
      - {bind: scorer_id_v2, from: "$.scorer_id"}
    expect_status: 200

  - name: scorer_ensemble_register
    method: POST
    path: /api/3.0/mlflow/scorers/register
    body:
      experiment_id: "0"
      name: corpus-ensemble
      serialized_scorer: '{"name":"corpus-ensemble","aggregations":null,"description":null,"is_session_level_scorer":false,"mlflow_version":"3.15.2.dev0","serialization_version":1,"builtin_scorer_class":null,"builtin_scorer_pydantic_data":null,"call_source":null,"call_signature":null,"original_func_name":null,"instructions_judge_pydantic_data":null,"memory_augmented_judge_data":null,"third_party_scorer_data":null,"ensemble_scorer_data":{"ensemble_fn":"majority_vote","scorers":[{"name":"corpus-ensemble-length","aggregations":null,"description":"Check whether the output length is within specified bounds.","is_session_level_scorer":false,"mlflow_version":"3.15.2.dev0","serialization_version":1,"builtin_scorer_class":"ResponseLength","builtin_scorer_pydantic_data":{"name":"corpus-ensemble-length","aggregations":null,"description":"Check whether the output length is within specified bounds.","required_columns":["outputs"],"inference_params":null,"extra_headers":null,"min_length":null,"max_length":100,"unit":"chars","instructions":"Check whether the output length in chars is within [max=100]."},"call_source":null,"call_signature":null,"original_func_name":null,"instructions_judge_pydantic_data":null,"memory_augmented_judge_data":null,"third_party_scorer_data":null,"ensemble_scorer_data":null}]}}'
    expect_status: 200

  - name: scorer_ensemble_get
    method: GET
    path: /ajax-api/3.0/mlflow/scorers/get
    query: {experiment_id: "0", name: corpus-ensemble}
    expect_status: 200

  - name: scorer_list_latest
    method: GET
    path: /api/3.0/mlflow/scorers/list
    query: {experiment_id: "0"}
    expect_status: 200

  - name: scorer_list_cross_experiment
    method: GET
    path: /ajax-api/3.0/mlflow/scorers/list
    expect_status: 200

  - name: scorer_list_invalid_experiment_id
    method: GET
    path: /api/3.0/mlflow/scorers/list
    query: {experiment_id: not-a-number}
    normalize: {drop_paths: ["$.message"]}
    expect_status: 400

  - name: scorer_versions
    method: GET
    path: /api/3.0/mlflow/scorers/versions
    query: {experiment_id: "0", name: corpus-length}
    expect_status: 200

  - name: scorer_get_latest
    method: GET
    path: /ajax-api/3.0/mlflow/scorers/get
    query: {experiment_id: "0", name: corpus-length}
    expect_status: 200

  - name: scorer_get_v1
    method: GET
    path: /api/3.0/mlflow/scorers/get
    query: {experiment_id: "0", name: corpus-length, version: 1}
    expect_status: 200

  - name: scorer_online_config_put
    method: PUT
    path: /ajax-api/3.0/mlflow/scorers/online-config
    body:
      experiment_id: "0"
      name: corpus-length
      # Activating a non-gateway scorer is rejected by upstream. A zero rate
      # persists the config while keeping this ResponseLength scorer inactive.
      sample_rate: 0.0
      filter_string: "status = 'OK'"
    expect_status: 200

  - name: scorer_online_configs_get
    method: GET
    path: /api/3.0/mlflow/scorers/online-configs
    query: {scorer_ids: [missing, "${scorer_id_v2}"]}
    expect_status: 200

  - name: scorer_register_decorator_rejected
    method: POST
    path: /api/3.0/mlflow/scorers/register
    body:
      experiment_id: "0"
      name: corpus-decorator
      serialized_scorer: '{"name":"corpus-decorator","call_source":"return true","call_signature":"(outputs)","original_func_name":"corpus_decorator"}'
    expect_status: 400

  - name: scorer_get_missing
    method: GET
    path: /ajax-api/3.0/mlflow/scorers/get
    query: {experiment_id: "0", name: corpus-missing}
    normalize: {drop_paths: ["$.message"]}
    expect_status: 404

  - name: scorer_delete_v1
    method: DELETE
    path: /api/3.0/mlflow/scorers/delete
    body: {experiment_id: "0", name: corpus-length, version: 1}
    expect_status: 200

  - name: scorer_delete_all
    method: DELETE
    path: /ajax-api/3.0/mlflow/scorers/delete
    body: {experiment_id: "0", name: corpus-length}
    expect_status: 200
