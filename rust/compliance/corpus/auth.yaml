# Section 3.16 - Auth & RBAC. This section boots BOTH servers with basic-auth
# enabled (MLFLOW_AUTH_CONFIG_PATH). Admin + a non-admin "alice" are seeded
# before the corpus runs. Cases assert 401/403/200 parity across the two
# servers. `auth: admin|user|null` selects credentials (null = no auth header).
cases:
  - name: auth_no_credentials_401
    method: GET
    path: /api/2.0/mlflow/experiments/search
    query: {max_results: 10}
    auth: null
    compare_body: false
    expect_status: 401

  - name: auth_bad_credentials_401
    method: POST
    path: /api/2.0/mlflow/experiments/create
    body: {name: should_fail}
    auth: null
    headers: {Authorization: "Basic bm9wZTpub3Bl"}
    compare_body: false
    expect_status: 401

  - name: auth_current_user_admin
    method: GET
    path: /api/2.0/mlflow/users/current
    auth: admin
    compare_body: false
    expect_status: 200

  - name: auth_admin_can_create_experiment
    method: POST
    path: /api/2.0/mlflow/experiments/create
    body: {name: admin_created_exp}
    auth: admin
    compare_body: false
    expect_status: 200

  - name: auth_nonadmin_read_default_ok
    method: GET
    path: /api/2.0/mlflow/experiments/search
    query: {max_results: 10}
    auth: user
    compare_body: false
    expect_status: 200

  - name: auth_nonadmin_create_experiment_ok_or_403
    method: POST
    path: /api/2.0/mlflow/experiments/create
    body: {name: user_created_exp}
    auth: user
    compare_body: false

  - name: auth_nonadmin_admin_route_forbidden
    method: GET
    path: /api/2.0/mlflow/users/get
    query: {username: admin}
    auth: user
    compare_body: false
    expect_status: 403

  - name: auth_webhooks_admin_only_for_user
    method: GET
    path: /api/2.0/mlflow/webhooks
    auth: user
    compare_body: false
    expect_status: 403

  - name: auth_admin_create_mcp_server
    method: POST
    path: /api/3.0/mlflow/mcp-servers
    body: {name: com.example/auth-actions}
    auth: admin
    expect_status: 200

  - name: auth_admin_get_mcp_server_has_no_allowed_actions
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/auth-actions
    auth: admin
    expect_status: 200

  - name: auth_user_get_mcp_server_has_allowed_actions
    method: GET
    path: /api/3.0/mlflow/mcp-servers/com.example/auth-actions
    auth: user
    expect_status: 200

  - name: auth_user_search_mcp_servers_has_allowed_actions
    method: GET
    path: /api/3.0/mlflow/mcp-servers
    query: {filter_string: "name = 'com.example/auth-actions'"}
    auth: user
    expect_status: 200

  - name: auth_admin_search_mcp_servers_has_no_allowed_actions
    method: GET
    path: /api/3.0/mlflow/mcp-servers
    query: {filter_string: "name = 'com.example/auth-actions'"}
    auth: admin
    expect_status: 200

  - name: auth_online_config_create_experiment_a
    method: POST
    path: /api/2.0/mlflow/experiments/create
    body: {name: auth_online_config_a}
    auth: admin
    bind:
      - {bind: auth_online_exp_a, from: "$.experiment_id"}
    expect_status: 200

  - name: auth_online_config_create_experiment_b
    method: POST
    path: /api/2.0/mlflow/experiments/create
    body: {name: auth_online_config_b}
    auth: admin
    bind:
      - {bind: auth_online_exp_b, from: "$.experiment_id"}
    expect_status: 200

  - name: auth_online_config_register_a
    method: POST
    path: /api/3.0/mlflow/scorers/register
    body:
      experiment_id: "${auth_online_exp_a}"
      name: auth-online-a
      serialized_scorer: '{"name":"auth-online-a","builtin_scorer_class":"ResponseLength","builtin_scorer_pydantic_data":{"max_length":100}}'
    auth: admin
    bind:
      - {bind: auth_online_scorer_a, from: "$.scorer_id"}
    expect_status: 200

  - name: auth_online_config_register_b
    method: POST
    path: /ajax-api/3.0/mlflow/scorers/register
    body:
      experiment_id: "${auth_online_exp_b}"
      name: auth-online-b
      serialized_scorer: '{"name":"auth-online-b","builtin_scorer_class":"ResponseLength","builtin_scorer_pydantic_data":{"max_length":100}}'
    auth: admin
    bind:
      - {bind: auth_online_scorer_b, from: "$.scorer_id"}
    expect_status: 200

  - name: auth_online_config_seed_a
    method: PUT
    path: /api/3.0/mlflow/scorers/online-config
    body:
      experiment_id: "${auth_online_exp_a}"
      name: auth-online-a
      sample_rate: 0.0
    auth: admin
    compare_body: false
    expect_status: 200

  - name: auth_online_config_seed_b
    method: PUT
    path: /ajax-api/3.0/mlflow/scorers/online-config
    body:
      experiment_id: "${auth_online_exp_b}"
      name: auth-online-b
      sample_rate: 0.0
    auth: admin
    compare_body: false
    expect_status: 200

  - name: auth_online_configs_query_read_allowed
    method: GET
    path: /api/3.0/mlflow/scorers/online-configs
    query:
      scorer_ids: ["${auth_online_scorer_a}", "${auth_online_scorer_b}"]
    auth: user
    expect_status: 200

  - name: auth_online_configs_body_read_allowed
    method: GET
    path: /ajax-api/3.0/mlflow/scorers/online-configs
    body:
      scorer_ids: ["${auth_online_scorer_a}", "${auth_online_scorer_b}"]
    auth: user
    expect_status: 200

  - name: auth_online_config_put_read_only_denied
    method: PUT
    path: /api/3.0/mlflow/scorers/online-config
    body:
      experiment_id: "${auth_online_exp_a}"
      name: auth-online-a
      sample_rate: 0.0
    auth: user
    compare_body: false
    expect_status: 403

  - name: auth_online_config_put_missing_experiment_denied
    method: PUT
    path: /ajax-api/3.0/mlflow/scorers/online-config
    body: {name: auth-online-a, sample_rate: 0.0}
    auth: user
    compare_body: false
    expect_status: 403

  - name: auth_online_config_deny_experiment_b
    method: POST
    path: /api/3.0/mlflow/users/permissions/grant
    body:
      username: alice
      resource_type: experiment
      resource_id: "${auth_online_exp_b}"
      permission: NO_PERMISSIONS
    auth: admin
    compare_body: false
    expect_status: 200

  - name: auth_online_configs_every_experiment_required
    method: GET
    path: /api/3.0/mlflow/scorers/online-configs
    query:
      scorer_ids: ["${auth_online_scorer_a}", "${auth_online_scorer_b}"]
    auth: user
    compare_body: false
    expect_status: 403

  - name: auth_online_config_grant_edit_a
    method: POST
    path: /ajax-api/3.0/mlflow/users/permissions/grant
    body:
      username: alice
      resource_type: experiment
      resource_id: "${auth_online_exp_a}"
      permission: EDIT
    auth: admin
    compare_body: false
    expect_status: 200

  - name: auth_online_config_put_edit_allowed
    method: PUT
    path: /ajax-api/3.0/mlflow/scorers/online-config
    body:
      experiment_id: "${auth_online_exp_a}"
      name: auth-online-a
      sample_rate: 0.0
    auth: user
    expect_status: 200
  - name: auth_admin_create_presigned_experiment
    method: POST
    path: /api/2.0/mlflow/experiments/create
    body: {name: auth_presigned_experiment}
    auth: admin
    compare_body: false
    bind:
      - {bind: auth_presigned_experiment_id, from: $.experiment_id}
    expect_status: 200

  - name: auth_admin_create_presigned_run
    method: POST
    path: /api/2.0/mlflow/runs/create
    body:
      experiment_id: "${auth_presigned_experiment_id}"
      start_time: 1
      run_name: auth-presigned-run
    auth: admin
    compare_body: false
    bind:
      - {bind: auth_presigned_run_id, from: $.run.info.run_id}
    expect_status: 200

  - name: auth_user_presigned_rpc_read_granted
    method: POST
    path: /api/2.0/mlflow/artifacts/presigned-download-url
    body: {run_id: "${auth_presigned_run_id}", path: missing.txt}
    auth: user
    compare_body: false
    expect_status: 501

  - name: auth_user_presigned_proxy_read_granted
    method: GET
    path: /ajax-api/2.0/mlflow-artifacts/presigned/${auth_presigned_experiment_id}/missing.txt
    auth: user
    compare_body: false
    expect_status: 501

  - name: auth_admin_revoke_experiment_read
    method: POST
    path: /api/3.0/mlflow/users/permissions/revoke
    body:
      username: alice
      resource_type: experiment
      resource_id: "${auth_presigned_experiment_id}"
    auth: admin
    compare_body: false
    expect_status: 200

  - name: auth_user_presigned_rpc_read_denied
    method: POST
    path: /ajax-api/2.0/mlflow/artifacts/presigned-download-url
    body: {run_id: "${auth_presigned_run_id}", path: missing.txt}
    auth: user
    compare_body: false
    expect_status: 403

  - name: auth_user_presigned_proxy_read_denied
    method: GET
    path: /api/2.0/mlflow-artifacts/presigned/${auth_presigned_experiment_id}/missing.txt
    auth: user
    compare_body: false
    expect_status: 403

  - name: auth_admin_restore_experiment_read
    method: POST
    path: /api/3.0/mlflow/users/permissions/grant
    body:
      username: alice
      resource_type: experiment
      resource_id: "${auth_presigned_experiment_id}"
      permission: READ
    auth: admin
    compare_body: false
    expect_status: 200

  - name: auth_user_presigned_rpc_read_restored
    method: POST
    path: /api/2.0/mlflow/artifacts/presigned-download-url
    body: {run_id: "${auth_presigned_run_id}", path: missing.txt}
    auth: user
    compare_body: false
    expect_status: 501

  - name: auth_user_presigned_proxy_read_restored
    method: GET
    path: /api/2.0/mlflow-artifacts/presigned/${auth_presigned_experiment_id}/missing.txt
    auth: user
    compare_body: false
    expect_status: 501
