# Upstream fcb20c33a: Flask `_download_artifact` file-response contract.
cases:
  - name: artifact_contract_setup_upload
    method: PUT
    path: /api/2.0/mlflow-artifacts/artifacts/conditional/hello.txt
    raw_body: "hello from compliance harness"
    compare_body: false
    expect_status: 200

  - name: artifact_contract_download
    method: GET
    path: /api/2.0/mlflow-artifacts/artifacts/conditional/hello.txt
    compare_body: true
    expect_status: 200
    compare_headers:
      - Content-Length
      - Cache-Control
      - ETag
      - Accept-Ranges
      - Content-Disposition
      - X-Content-Type-Options
    expect_headers:
      Content-Length: "29"
      Last-Modified: {matches: '^[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT$'}
      Cache-Control: no-cache
      ETag: {matches: '^"[0-9]+\.[0-9]+-29-[0-9]+"$'}
      Accept-Ranges: bytes
      Content-Disposition: attachment; filename=hello.txt
      X-Content-Type-Options: nosniff

  - name: artifact_contract_download_range
    method: GET
    path: /api/2.0/mlflow-artifacts/artifacts/conditional/hello.txt
    headers: {Range: "bytes=0-3"}
    compare_body: true
    expect_status: 206
    compare_headers: [Content-Length, Content-Range, Cache-Control, ETag, Accept-Ranges]
    expect_headers:
      Content-Length: "4"
      Content-Range: bytes 0-3/29
      Last-Modified: {matches: '^[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT$'}
      Cache-Control: no-cache
      ETag: {matches: '^"[0-9]+\.[0-9]+-29-[0-9]+"$'}
      Accept-Ranges: bytes

  - name: artifact_contract_download_unsatisfiable_range
    method: GET
    path: /api/2.0/mlflow-artifacts/artifacts/conditional/hello.txt
    headers: {Range: "bytes=100-200"}
    compare_body: true
    expect_status: 416
    compare_headers: [Content-Length, Content-Range, Content-Type]
    expect_headers:
      Content-Range: bytes */29

  - name: artifact_contract_download_if_none_match
    method: GET
    path: /api/2.0/mlflow-artifacts/artifacts/conditional/hello.txt
    # `_download_artifact` copies into a fresh temporary pathname on every
    # request, making its path-checksum ETag volatile. `*` is the RFC wildcard
    # match and exercises the same Werkzeug If-None-Match 304 branch.
    headers: {If-None-Match: "*"}
    compare_body: true
    expect_status: 304
    compare_headers: [Cache-Control, ETag, Accept-Ranges, Content-Disposition]
    expect_headers:
      Cache-Control: no-cache
      ETag: {matches: '^"[0-9]+\.[0-9]+-29-[0-9]+"$'}
      Accept-Ranges: bytes
      Content-Disposition: attachment; filename=hello.txt

  - name: artifact_contract_download_invalid_path
    method: GET
    path: /api/2.0/mlflow-artifacts/artifacts/conditional/%2E%2E%2Fsecret.txt
    compare_body: true
    expect_status: 400
