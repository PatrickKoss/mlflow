cases:
  - name: issues_invoke_unknown_provider_preserves_case
    method: POST
    path: /ajax-api/3.0/mlflow/issues/invoke
    body:
      experiment_id: "0"
      trace_ids: [tr-corpus-a]
      categories: [correctness]
      provider: UnknownAI
      model: unknown-model
    expect_status: 400

  - name: issues_invoke_missing_single_provider_key
    method: POST
    path: /ajax-api/3.0/mlflow/issues/invoke
    body:
      experiment_id: "0"
      trace_ids: [tr-corpus-a]
      categories: [correctness]
      provider: OpenAI
      model: gpt-5
    expect_status: 400

  - name: issues_invoke_missing_bedrock_credentials
    method: POST
    path: /ajax-api/3.0/mlflow/issues/invoke
    body:
      experiment_id: "0"
      trace_ids: [tr-corpus-a]
      categories: [correctness]
      provider: Bedrock
      model: anthropic.claude
    expect_status: 400
